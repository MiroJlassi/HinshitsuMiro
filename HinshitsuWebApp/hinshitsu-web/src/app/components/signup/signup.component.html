<div class="container">
  <div class="card">
    <h1>Sign Up</h1>

    <form (ngSubmit)="onSubmit()">
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Full Name"
        required
        [disabled]="loading"
      />

      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
        [disabled]="loading"
      />

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
        [disabled]="loading"
      />

      <input
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm Password"
        required
        [disabled]="loading"
      />

      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Sign Up' }}
      </button>

      <p class="link">Already have an account? <a routerLink="/login">Sign in</a></p>
    </form>
  </div>
</div>
